<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKR Learning Challenge</title>
<style>
:root{--bg:#100b25;--panel:#21183b;--purple:#8b5cf6;--yellow:#ffd84d;--muted:#b9add4;--good:#35d39a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#392064,transparent 36%),#100b25;color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px}.card{background:var(--panel);border:1px solid #ffffff20;border-radius:20px;padding:20px;margin:15px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-size:25px;font-weight:850}.muted{color:var(--muted)}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff30;background:#342653;color:white;margin:6px 0 12px;font:inherit}label{font-size:13px;color:var(--muted)}button{border:0;border-radius:11px;padding:11px 16px;background:var(--yellow);color:#261747;font-weight:750;cursor:pointer;margin:4px}button.alt{background:#49336e;color:#fff}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.subject{background:#342653;border:1px solid #ffffff20;border-radius:15px;padding:16px;cursor:pointer}.subject:hover{border-color:var(--yellow)}.hide{display:none}.question{font-size:23px;font-weight:800;margin:18px 0}.choice{display:block;text-align:left;width:100%;background:#39295a;color:#fff;margin:8px 0}.choice.selected{outline:2px solid var(--yellow)}.bar{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;background:#ffffff0c;border-radius:10px;margin:10px 0}h2{margin-top:0}@media(max-width:600px){.wrap{padding:12px}.card{padding:15px}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="brand">🎓 SKR Learning Challenge</div><div class="muted">แพลตฟอร์มคลังคำถามและกิจกรรมการเรียนรู้</div></div><div id="userbar" class="muted"></div></header>
<section id="login" class="card" style="max-width:460px;margin:55px auto"><h2>เข้าสู่ระบบ</h2><label>รหัสนักศึกษา / ชื่อผู้ใช้</label><input id="code" placeholder="กรอกรหัสนักศึกษาหรือ ADMIN"><label>รหัสผ่าน</label><input id="pass" type="password" placeholder="รหัสผ่าน"><button onclick="login()">เข้าสู่ระบบ</button><div id="loginmsg" class="notice muted">หากยังไม่มีบัญชี กรุณาติดต่อครูผู้ดูแลระบบ</div></section>
<section id="home" class="hide"><div class="card"><div class="top"><div><h2 id="welcome">ยินดีต้อนรับ</h2><div class="muted">เลือกวิชาที่ต้องการฝึกทำแบบทดสอบ</div></div><button class="alt" onclick="logout()">ออกจากระบบ</button></div></div>
<div id="studentArea"><h2>📚 เลือกรายวิชา</h2><div id="subjects" class="grid"></div><div id="quiz" class="card hide"></div></div>
<div id="adminArea" class="hide"><h2>🛠️ เครื่องมือครูและผู้ดูแล</h2><div class="grid">
<div class="card"><h3>เพิ่มรายวิชา</h3><label>ชื่อวิชา</label><input id="subName" placeholder="เช่น ภาษาไทย"><label>ระดับ</label><input id="subLevel" placeholder="เช่น ม.ต้น"><label>รายละเอียด</label><input id="subDesc"><button onclick="addSubject()">บันทึกวิชา</button></div>
<div class="card"><h3>เพิ่มคำถามปรนัย</h3><label>รายวิชา</label><select id="qSubject"></select><label>ระดับความยาก</label><select id="qLevel"><option>พื้นฐาน</option><option>ปานกลาง</option><option>ยาก</option></select><label>คำถาม</label><textarea id="qText" rows="2"></textarea><div class="grid"><input id="a" placeholder="ตัวเลือก A"><input id="b" placeholder="ตัวเลือก B"><input id="c" placeholder="ตัวเลือก C"><input id="d" placeholder="ตัวเลือก D"></div><label>เฉลย (พิมพ์ข้อความตัวเลือกให้ตรงกัน)</label><input id="answer"><label>คำอธิบาย</label><textarea id="explain" rows="2"></textarea><button onclick="addQuestion()">บันทึกคำถาม</button></div>
<div class="card"><h3>เพิ่มบัญชีนักศึกษา</h3><label>รหัสนักศึกษา</label><input id="stuCode"><label>ชื่อ-นามสกุล</label><input id="stuName"><label>รหัสผ่านเริ่มต้น</label><input id="stuPass" type="password"><button onclick="addStudent()">สร้างบัญชี</button></div>
</div><div class="card"><h3>📊 ผลการทำแบบทดสอบล่าสุด</h3><button class="alt" onclick="loadReport()">โหลดรายงาน</button><div id="report" class="muted"></div></div></div></section>
</main><script>
let token='',me=null,subjects=[],questions=[],answers={},currentSubject='';
function call(action,payload={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r):reject(new Error(r?.message||'เกิดข้อผิดพลาด'))).withFailureHandler(e=>reject(e)).api(action,{...payload,token}));}
function msg(id,text){document.getElementById(id).textContent=text}
async function login(){try{let r=await call('login',{studentCode:document.getElementById('code').value,password:document.getElementById('pass').value});token=r.token;me=r.user;document.getElementById('login').classList.add('hide');document.getElementById('home').classList.remove('hide');await boot()}catch(e){msg('loginmsg',e.message)}}
async function boot(){let r=await call('bootstrap');me=r.user;subjects=r.subjects;document.getElementById('welcome').textContent='สวัสดี '+me.fullName;document.getElementById('userbar').textContent=me.role==='student'?'นักศึกษา':'ครู / ผู้ดูแล';document.getElementById('studentArea').classList.toggle('hide',me.role!=='student');document.getElementById('adminArea').classList.toggle('hide',!['admin','teacher'].includes(me.role));document.getElementById('subjects').innerHTML=subjects.map(s=>'<div class="subject" onclick="startQuiz(\''+s.subjectId+'\')"><h3>📘 '+esc(s.name)+'</h3><div class="muted">'+esc(s.level||'')+'</div><small>'+esc(s.description||'')+'</small></div>').join('')||'<div class="notice">ยังไม่มีรายวิชา</div>';document.getElementById('qSubject').innerHTML=subjects.map(s=>'<option value="'+s.subjectId+'">'+esc(s.name)+'</option>').join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function logout(){try{await call('logout')}catch(e){}token='';location.reload()}
async function startQuiz(id){currentSubject=id;answers={};let r=await call('getQuestions',{subjectId:id,count:10});questions=r.questions;let q=document.getElementById('quiz');q.classList.remove('hide');if(!questions.length){q.innerHTML='<h3>ยังไม่มีคำถามในรายวิชานี้</h3>';return}renderQuestion(0);q.scrollIntoView({behavior:'smooth'})}
function renderQuestion(i){let q=questions[i],box=document.getElementById('quiz');box.innerHTML='<div class="muted">ข้อ '+(i+1)+' / '+questions.length+'</div><div class="question">'+esc(q.question)+'</div>'+['A','B','C','D'].map(k=>'<button class="choice '+(answers[q.questionId]===q['choice'+k]?'selected':'')+'" onclick="choose(\''+q.questionId+'\',\''+k+'\')">'+k+'. '+esc(q['choice'+k])+'</button>').join('')+'<div class="bar"><button class="alt" '+(i===0?'disabled':'')+' onclick="renderQuestion('+(i-1)+')">ก่อนหน้า</button><button onclick="'+(i===questions.length-1?'finishQuiz()':'renderQuestion('+(i+1)+')')+'">'+(i===questions.length-1?'ส่งคำตอบ':'ข้อต่อไป')+'</button></div>'}
function choose(id,k){let q=questions.find(x=>x.questionId===id);answers[id]=q['choice'+k];renderQuestion(questions.indexOf(q))}
async function finishQuiz(){if(Object.keys(answers).length!==questions.length&&!confirm('ยังตอบไม่ครบ ต้องการส่งคำตอบหรือไม่?'))return;try{let r=await call('submitAttempt',{subjectId:currentSubject,answers:questions.map(q=>({questionId:q.questionId,answer:answers[q.questionId]||''}))});document.getElementById('quiz').innerHTML='<h2>🎉 สรุปผล</h2><div class="question">'+r.score+' / '+r.total+' คะแนน</div><div class="notice">บันทึกผลการทำแบบทดสอบเรียบร้อยแล้ว</div><button onclick="document.getElementById(\'quiz\').classList.add(\'hide\')">กลับหน้ารายวิชา</button>'}catch(e){alert(e.message)}}
async function addSubject(){try{await call('addSubject',{name:val('subName'),level:val('subLevel'),description:val('subDesc')});alert('เพิ่มรายวิชาแล้ว');await boot()}catch(e){alert(e.message)}}
async function addQuestion(){try{await call('addQuestion',{subjectId:val('qSubject'),level:val('qLevel'),question:val('qText'),choiceA:val('a'),choiceB:val('b'),choiceC:val('c'),choiceD:val('d'),answer:val('answer'),explanation:val('explain')});alert('เพิ่มคำถามแล้ว');['qText','a','b','c','d','answer','explain'].forEach(id=>document.getElementById(id).value='')}catch(e){alert(e.message)}}
async function addStudent(){try{await call('addStudent',{studentCode:val('stuCode'),fullName:val('stuName'),password:val('stuPass')});alert('สร้างบัญชีนักศึกษาแล้ว');['stuCode','stuName','stuPass'].forEach(id=>document.getElementById(id).value='')}catch(e){alert(e.message)}}
async function loadReport(){try{let r=await call('getReport');document.getElementById('report').innerHTML=r.attempts.map(a=>'<div class="notice">'+esc(a.studentCode)+' · '+esc(a.fullName)+' · '+esc(a.score)+'/'+esc(a.total)+' · '+esc(a.subjectId)+'</div>').join('')||'ยังไม่มีข้อมูล'}catch(e){alert(e.message)}}
function val(id){return document.getElementById(id).value.trim()}
</script></body></html>
